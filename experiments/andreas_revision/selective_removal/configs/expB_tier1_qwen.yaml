# JOURNAL REVISION, Experiment B (protocols/PROTOCOL_JOURNAL_REVISION.md §B): selective removal of HUMAN-verified
# false contradictions. NOT RUNNABLE until labels/expB_tier1_labels.json exists, built by
#   select_questions.py labels <final_labels.csv> <v3 key> expB_tier1_qids.json labels/expB_tier1_labels.json
# from adjudicated human labels of package v3. Same reader and settings as configs/confirm2.yaml.
stage: revision
name: expB-selective-removal-tier1
seed: 0
datasets:
  - {name: 2wikimultihopqa, split: dev, qids_file: experiments/andreas_revision/selective_removal/expB_tier1_qids.json}
  - {name: hotpotqa, split: dev, qids_file: experiments/andreas_revision/selective_removal/expB_tier1_qids.json}
model:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: pinned
  device: cuda
  dtype: bfloat16
  max_new_tokens: 64
  max_input_tokens: 4096
  max_time_s: 60
  batch_size: 1
retrieval: {method: bm25, top_k: 4, rerank_pool: 10, corpus_prefilter: 50}
extraction: {method: llm, on_empty: drop, min_lexical_support: 0.6, max_new_tokens: 96}
egrag: {token_budget: 450, max_claims: 12, selector: greedy_connected}
excluded_questions: configs/excluded_confirm2.json
verified_annotations: null
exp1:
  representations: [R4P_FO, R4P_FO_SC, R4P_FO_NC, R4P_FO_SN]
  evidence_source: gold
  evidence_scope: gold_passages
  protocols: [A]
  budgets: ["content:1.0"]        # unused with protocols [A]
  selection: [relevance]
  budget_policies: [shared]
  shuffle_seeds: [0]
  contradiction_labels: experiments/andreas_revision/selective_removal/labels/expB_tier1_labels.json
max_generations: 200000
