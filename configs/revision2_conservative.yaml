# REVISION-2, EXPLORATORY (docs/REVISION2_PROTOCOL.md §2): stricter abstention guidance (qa-v2-conservative) on the
# same 1,000 confirm_v1 2Wiki questions as rev-noabst-v1. Compared with qa-v2 (confirmatory run) and qa-v2-noabst.
stage: revision
name: rev2-conservative-v1
seed: 0
datasets:
  - {name: 2wikimultihopqa, split: dev, qids_file: configs/question_sets/confirm_v1_2wiki_sub1000.json}
model:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: pinned
  device: cuda
  dtype: bfloat16
  max_new_tokens: 64
  max_input_tokens: 4096
  max_time_s: 60
  batch_size: 1
  prompt_variant: qa-v2-conservative
retrieval: {method: bm25, top_k: 4, rerank_pool: 10, corpus_prefilter: 50}
extraction: {method: llm, on_empty: drop, min_lexical_support: 0.6, max_new_tokens: 96}
egrag: {token_budget: 450, max_claims: 12, selector: greedy_connected}
excluded_questions: configs/excluded_confirmatory.json
verified_annotations: null
exp1:
  representations: [R0, R1, R4, R4P]
  evidence_source: gold
  evidence_scope: gold_passages
  protocols: [A]
  budgets: ["content:1.0"]        # unused with protocols [A]
  selection: [relevance]
  budget_policies: [shared]
  shuffle_seeds: [0]
max_generations: 200000
