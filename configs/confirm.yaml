# CONFIRMATORY RUN (docs/CONFIRMATORY_PROTOCOL.md, frozen before sampling). Stage `full`:
# requires WSH_COMPUTE_AUTHORIZED=1 AND --authorized-compute; refuses every pilot question.
# Six pre-specified tests (R1-R0, R5-R1, R4-R5 x MuSiQue, 2Wiki), Protocol A, EM, Holm over 6.
# Same generator/decoding/prompt as configs/gpu_pilot.yaml; batch_size 1 (GPU_PREFLIGHT_REPORT §5).
stage: full
name: confirm-v1
seed: 0
datasets:
  - {name: musique, split: dev, qids_file: configs/question_sets/confirm_v1.json}
  - {name: 2wikimultihopqa, split: dev, qids_file: configs/question_sets/confirm_v1.json}
model:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: pinned
  device: cuda
  dtype: bfloat16
  max_new_tokens: 64
  max_input_tokens: 4096
  max_time_s: 60
  batch_size: 1
retrieval: {method: bm25, top_k: 4, rerank_pool: 10, corpus_prefilter: 50}
extraction: {method: llm, on_empty: drop, min_lexical_support: 0.6, max_new_tokens: 96}
egrag: {token_budget: 450, max_claims: 12, selector: greedy_connected}
excluded_questions: configs/excluded_confirmatory.json
verified_annotations: null
exp1:
  representations: [R0, R1, R2, R3, R4, R4P, R5]
  evidence_source: gold
  evidence_scope: gold_passages
  protocols: [A]                  # Protocol B is outside the confirmatory family (CONFIRMATORY_PROTOCOL §3)
  budgets: ["content:1.0"]        # unused with protocols [A]
  selection: [relevance]
  budget_policies: [shared]
  shuffle_seeds: [0, 1, 2]
max_generations: 200000
