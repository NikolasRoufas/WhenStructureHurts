    architecture: qwen3_5 (Qwen3_5ForConditionalGeneration checkpoint, loaded as Qwen3_5ForCausalLM)
    chat_template_kwargs: {enable_thinking: false}   # default template opens a <think> block
    stages: [gpu_pilot, full]

