    revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
    n_params: 3085938688
    weight_bytes: 6171877376       # bf16
    precision: bfloat16
    license: other - Qwen RESEARCH license (non-commercial use; check terms before publishing artefacts)
    architecture: Qwen2ForCausalLM (qwen2; supported by transformers 5.12.1 AutoModelForCausalLM)
    stages: [gpu_pilot, full]
  Qwen/Qwen3.5-9B:
    # Hub repo is a natively multimodal checkpoint (Qwen3_5ForConditionalGeneration,
    # image-text-to-text); there is no "-Instruct" repo. n_params is the Hub total incl. the
    # vision tower; AutoModelForCausalLM maps qwen3_5 -> Qwen3_5ForCausalLM, which ignores the
    # model.visual.* and mtp.* weights and remaps the language_model prefix (transformers
    # 5.12.1 conversion_mapping) - text-only loading is expected but NOT yet verified by loading.
    # Hybrid attention (Gated DeltaNet linear + full attention): batched vs unbatched equality
    # must be checked on the server (`wsh preflight --batch-check`) before batch_size > 1.
    revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    n_params: 9653104368
    weight_bytes: 19306208736      # bf16, whole checkpoint (text-only load is smaller)
