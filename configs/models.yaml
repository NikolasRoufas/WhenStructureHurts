# Model registry and execution policy. Revisions and parameter counts were read from the
# Hugging Face Hub API (safetensors metadata): small models on 2026-10-10, the GPU models
# (Qwen2.5-3B/7B-Instruct, Qwen3.5-9B) re-verified on 2026-10-11. GPU-model weights have NOT
# been downloaded or executed.
# Enforced programmatically by wsh.models.policy:
#   * a model must be listed here with a pinned revision and a parameter count;
#   * smoke and pilot stages accept only models with n_params <= 1e9 and no forbidden size
#     pattern in the name (these are the local-development stages);
#   * gpu_pilot (exploratory GPU pilot on the frozen pilot questions) and full (confirmatory)
#     accept larger models ONLY with WSH_COMPUTE_AUTHORIZED=1 in the environment AND the
#     --authorized-compute CLI flag. Authorisation never launches anything by itself;
#   * a generator must list the stage in `stages`;
#   * parameter counts are re-checked after loading; a mismatch aborts the run.

policy:
  stages:
    smoke:     {max_params: 1.0e9, requires_authorization: false}
    pilot:     {max_params: 1.0e9, requires_authorization: false}
    gpu_pilot: {max_params: 1.0e11, requires_authorization: true}
    revision:  {max_params: 1.0e11, requires_authorization: true}   # post-hoc exploratory (revision-1)
    full:      {max_params: 1.0e11, requires_authorization: true}
  forbidden_name_patterns_unauthorized_stages:
    - "(?i)(^|[^0-9.])(1\\.5|3|4|7|8|9|13|14|32|70|72)b"
  safety_margin_disk_gb: 2.0
  ram_multiplier: 2.5          # required free RAM >= multiplier * weight bytes (CPU loading)

