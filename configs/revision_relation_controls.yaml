# REVISION-1, POST-HOC EXPLORATORY: fixed-order relation controls (src/wsh/representations/relation_controls.py)
# on the already-analysed confirmatory questions (confirm_v1). Separates predicted relation lines,
# contradiction lines, line count/label semantics and item order. R4/R4P/R5 are expected to be served
# from the generation cache (identical prompts). Never confirmatory (stage `revision`).
stage: revision
name: rev-relation-controls-v1
seed: 0
datasets:
  - {name: musique, split: dev, qids_file: configs/question_sets/confirm_v1.json}
  - {name: 2wikimultihopqa, split: dev, qids_file: configs/question_sets/confirm_v1.json}
model:
  model_id: Qwen/Qwen2.5-7B-Instruct
  revision: pinned
  device: cuda
  dtype: bfloat16
  max_new_tokens: 64
  max_input_tokens: 4096
  max_time_s: 60
  batch_size: 1
retrieval: {method: bm25, top_k: 4, rerank_pool: 10, corpus_prefilter: 50}
extraction: {method: llm, on_empty: drop, min_lexical_support: 0.6, max_new_tokens: 96}
egrag: {token_budget: 450, max_claims: 12, selector: greedy_connected}
excluded_questions: configs/excluded_confirmatory.json
verified_annotations: null
exp1:
  representations: [R5, R4, R4P, R4P_FO, R4P_FO_NC, R4N_FO, R5P, R4P_NC]
  evidence_source: gold
  evidence_scope: gold_passages
  protocols: [A]
  budgets: ["content:1.0"]        # unused with protocols [A]
  selection: [relevance]
  budget_policies: [shared]
  shuffle_seeds: [0]
max_generations: 200000
